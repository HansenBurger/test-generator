services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: test-generator-backend:latest
    container_name: test-generator-backend
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ./backend:/app
      - "${DATA_VOLUME:-backend_data}:${DATA_DIR:-/app/data}"
    environment:
      - PYTHONUNBUFFERED=1
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_API_BASE_URL=${DASHSCOPE_API_BASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - PARSED_DIR=${PARSED_DIR}
      - GENERATION_DIR=${GENERATION_DIR}
      - XMIND_DIR=${XMIND_DIR}
    restart: unless-stopped
    networks:
      - test-generator-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: test-generator-frontend:latest
    container_name: test-generator-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - test-generator-network

volumes:
  backend_data:


networks:
  test-generator-network:
    driver: bridge
